# Gradle Version Catalog — centralises all dependency versions and coordinates.
# Referenced from build.gradle.kts files using `libs.*` accessor syntax.

[versions]
agp                = "9.2.1"
kotlin             = "2.4.20"
ksp                = "2.3.2"
compose-bom        = "2024.10.00"
navigation-compose = "2.10.1"
room               = "2.8.5"
coroutines         = "1.11.0"
lifecycle          = "2.11.0"
core-ktx           = "1.19.0"
core-splashscreen  = "1.2.0"
activity-compose   = "1.13.0"
xr-runtime         = "1.0.0-rc01"
xr-scenecore       = "1.0.0-rc01"
xr-compose         = "1.0.0-alpha17"
xr-material3       = "1.0.0-alpha17"
xr-extensions      = "1.4.0"
adaptive           = "1.3.0"
revenuecat         = "10.21.1"
play-services-ads  = "25.4.0"
lottie             = "6.7.1"
junit              = "4.13.2"
androidx-test-ext  = "1.2.1"
espresso           = "3.6.1"
mockito            = "5.11.0"
mockito-kotlin     = "5.3.1"


[libraries]
androidx-core-ktx           = { group = "androidx.core",            name = "core-ktx",                   version.ref = "core-ktx"           }
androidx-core-splashscreen  = { group = "androidx.core",            name = "core-splashscreen",          version.ref = "core-splashscreen"  }
androidx-activity-compose   = { group = "androidx.activity",        name = "activity-compose",            version.ref = "activity-compose"   }
compose-bom                 = { group = "androidx.compose",         name = "compose-bom",                 version.ref = "compose-bom"        }
compose-ui                  = { group = "androidx.compose.ui",      name = "ui"                                                              }
compose-ui-graphics         = { group = "androidx.compose.ui",      name = "ui-graphics"                                                     }
compose-ui-tooling          = { group = "androidx.compose.ui",      name = "ui-tooling"                                                      }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",      name = "ui-tooling-preview"                                              }
compose-material3           = { group = "androidx.compose.material3", name = "material3"                                                     }
compose-material-icons      = { group = "androidx.compose.material", name = "material-icons-extended"                                        }
navigation-compose          = { group = "androidx.navigation",      name = "navigation-compose",          version.ref = "navigation-compose" }
lifecycle-viewmodel         = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-ktx",     version.ref = "lifecycle"          }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-compose", version.ref = "lifecycle"          }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",       version.ref = "lifecycle"          }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",       name = "lifecycle-runtime-compose",   version.ref = "lifecycle"          }
room-runtime                = { group = "androidx.room",            name = "room-runtime",                version.ref = "room"               }
room-ktx                    = { group = "androidx.room",            name = "room-ktx",                   version.ref = "room"               }
room-compiler               = { group = "androidx.room",            name = "room-compiler",               version.ref = "room"               }
coroutines-android          = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",  version.ref = "coroutines"         }

# Adaptive Libraries
androidx-adaptive           = { group = "androidx.compose.material3.adaptive", name = "adaptive",           version.ref = "adaptive"           }
androidx-adaptive-layout    = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout",    version.ref = "adaptive"           }
androidx-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "adaptive"           }
androidx-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "adaptive" }
androidx-window-core        = { group = "androidx.window",          name = "window-core",                version = "1.5.1"                  }

# XR SDK Libraries
xr-runtime                  = { group = "androidx.xr.runtime",      name = "runtime",                     version.ref = "xr-runtime"         }
xr-scenecore                = { group = "androidx.xr.scenecore",    name = "scenecore",                   version.ref = "xr-scenecore"       }
xr-compose                  = { group = "androidx.xr.compose",      name = "compose",                     version.ref = "xr-compose"         }
xr-material3                = { group = "androidx.xr.compose.material3", name = "material3",               version.ref = "xr-material3"       }
xr-extensions               = { group = "com.android.extensions.xr", name = "extensions-xr",              version.ref = "xr-extensions"      }

# RevenueCat
revenuecat-purchases        = { group = "com.revenuecat.purchases", name = "purchases",                   version.ref = "revenuecat"         }
revenuecat-purchases-ui     = { group = "com.revenuecat.purchases", name = "purchases-ui",                version.ref = "revenuecat"         }
revenuecat-purchases-admob  = { group = "com.revenuecat.purchases", name = "purchases-admob",             version.ref = "revenuecat"         }
play-services-ads           = { group = "com.google.android.gms", name = "play-services-ads",             version.ref = "play-services-ads"  }
lottie-compose              = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }
junit                       = { group = "junit",                    name = "junit",                      version.ref = "junit"              }
androidx-test-ext-junit     = { group = "androidx.test.ext",        name = "junit",                      version.ref = "androidx-test-ext"  }
androidx-espresso-core      = { group = "androidx.test.espresso",   name = "espresso-core",               version.ref = "espresso"           }
androidx-compose-ui-test    = { group = "androidx.compose.ui",      name = "ui-test-junit4"                                                  }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest"                                               }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-test",     version.ref = "coroutines"         }
mockito-core                = { group = "org.mockito",              name = "mockito-core",                version.ref = "mockito"            }
mockito-kotlin              = { group = "org.mockito.kotlin",       name = "mockito-kotlin",              version.ref = "mockito-kotlin"     }

[plugins]
android-application = { id = "com.android.application",    version.ref = "agp"    }
ksp                 = { id = "com.google.devtools.ksp",     version.ref = "ksp"    }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
